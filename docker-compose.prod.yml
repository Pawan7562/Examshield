# Production High-Concurrency Cluster Orchestration for ExamShield (16 Scaled Nodes + Local Postgres + Redis)
services:
  # 1. Reverse Proxy & Professional Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: examshield_load_balancer
    restart: always
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend_1
      - backend_2
      - frontend
    networks:
      - examshield_network

  # 2. Redis Cache & Socket.IO Pub/Sub Cluster Backbone
  redis:
    image: redis:7-alpine
    container_name: examshield_redis
    restart: always
    mem_limit: 512m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      examshield_network:
        aliases:
          - redis

  # 3. Dedicated High-Performance PostgreSQL 18
  postgres:
    image: postgres:alpine
    container_name: examshield_postgres
    restart: always
    mem_limit: 800m
    environment:
      POSTGRES_DB: examshield_prod
      POSTGRES_USER: examshield_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ex@mShield_Pr0d_Db_2026!}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c max_connections=400
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c synchronous_commit=off
      -c random_page_cost=1.1
    networks:
      examshield_network:
        aliases:
          - postgres

  # 4. Frontend Application Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: examshield-frontend:latest
    container_name: examshield-frontend-1
    restart: always
    mem_limit: 64m
    environment:
      NODE_ENV: production
    networks:
      - examshield_network

  # 5. Scaled Backend Cluster Nodes (Nodes 1 - 16)
  backend_1: &backend_template
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examshield-backend:latest
    container_name: examshield-backend-1
    restart: always
    mem_limit: 250m
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: cluster_node_1
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://examshield_admin:Ex%40mShield_Pr0d_Db_2026%21@postgres:5432/examshield_prod?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://examshield_admin:Ex%40mShield_Pr0d_Db_2026%21@postgres:5432/examshield_prod?sslmode=disable
      PG_POOL_MAX: 20
      PG_CONNECTION_TIMEOUT_MS: 10000
    depends_on:
      - redis
      - postgres
    networks:
      examshield_network:
        aliases:
          - backend

  backend_2:
    <<: *backend_template
    container_name: examshield-backend-2
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: cluster_node_2
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://examshield_admin:Ex%40mShield_Pr0d_Db_2026%21@postgres:5432/examshield_prod?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://examshield_admin:Ex%40mShield_Pr0d_Db_2026%21@postgres:5432/examshield_prod?sslmode=disable
