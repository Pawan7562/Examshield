    L 32 35.5
    L 28 35.5
    Z
  " fill="#ffffff" />

  <!-- Diagonal stroke -->
  <path d="
    M 34.5 32
    L 44 32
    L 66 65
    L 66 68
    L 57 68
    L 34.5 35
    Z
  " fill="#ffffff" />

  <!-- Right stem, serif top & bottom -->
