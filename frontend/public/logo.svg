<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163474" />
      <stop offset="50%" stop-color="#183b84" />
      <stop offset="100%" stop-color="#1c4196" />
    </linearGradient>
    <filter id="nxDropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#163474" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="26" ry="26" fill="url(#nxBg)" />

  <!-- High-contrast Serif 'N' -->
  <!-- Left stem, serif top & bottom -->
