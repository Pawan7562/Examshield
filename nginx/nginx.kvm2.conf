# High-Performance Nginx Load Balancer for ExamShield on KVM 2 VPS
user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 20480;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;

    # Fast I/O & Keep-Alive
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer & Payload tuning
    client_body_buffer_size 128k;
    client_max_body_size 30M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting Zones (High concurrency NAT safe)
    limit_req_zone $binary_remote_addr zone=api_ip_limit:40m rate=1500r/s;
    limit_req_zone $binary_remote_addr zone=auth_ip_limit:20m rate=1000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:40m;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Scaled Backend Cluster Upstream (16 Nodes High-Concurrency Cluster)
    upstream backend_cluster {
        least_conn;
        server backend_1:5000 max_fails=0;
        server backend_2:5000 max_fails=0;
        server backend_3:5000 max_fails=0;
        server backend_4:5000 max_fails=0;
        server backend_5:5000 max_fails=0;
        server backend_6:5000 max_fails=0;
        server backend_7:5000 max_fails=0;
        server backend_8:5000 max_fails=0;
        server backend_9:5000 max_fails=0;
        server backend_10:5000 max_fails=0;
        server backend_11:5000 max_fails=0;
        server backend_12:5000 max_fails=0;
        server backend_13:5000 max_fails=0;
        server backend_14:5000 max_fails=0;
        server backend_15:5000 max_fails=0;
        server backend_16:5000 max_fails=0;
        keepalive 128;
    }

    # Socket.IO Cluster Upstream (Sticky Session across cluster nodes)
    upstream socketio_cluster {
        ip_hash;
        server backend_1:5000 max_fails=0;
        server backend_2:5000 max_fails=0;
        server backend_3:5000 max_fails=0;
        server backend_4:5000 max_fails=0;
        server backend_5:5000 max_fails=0;
        server backend_6:5000 max_fails=0;
        server backend_7:5000 max_fails=0;
        server backend_8:5000 max_fails=0;
        server backend_9:5000 max_fails=0;
        server backend_10:5000 max_fails=0;
        server backend_11:5000 max_fails=0;
        server backend_12:5000 max_fails=0;
        server backend_13:5000 max_fails=0;
        server backend_14:5000 max_fails=0;
        server backend_15:5000 max_fails=0;
        server backend_16:5000 max_fails=0;
        keepalive 128;
    }

    server {
        listen 80;
        server_name exam.nexifyforge.in www.exam.nexifyforge.in localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn conn_limit 5000;

        # Custom Branded Error Pages
        error_page 500 502 503 504 /error_pages/50x.html;
        error_page 404 /error_pages/404.html;

        location ^~ /error_pages/ {
            root /usr/share/nginx/html;
            internal;
        }

        # Dedicated JSON error handler for API requests
        location @api_error_json {
            default_type application/json;
            return 502 '{"success":false,"status":502,"code":"CLUSTER_SYNCHRONIZING","message":"The examination cluster is momentarily synchronizing. Your answers and session remain safely preserved.","retryAfter":3}\n';
        }

        # Health Check Endpoint
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","load_balancer":"examshield_nginx"}\n';
            add_header Content-Type application/json;
        }

        # WebSocket / Socket.IO Live Monitoring Endpoint
        location /socket.io/ {
            proxy_pass http://socketio_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # API Authentication Endpoints
        location /api/auth/ {
            limit_req zone=auth_ip_limit burst=2500 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 6;
            proxy_next_upstream_timeout 30s;

            proxy_intercept_errors on;
            error_page 500 502 503 504 = @api_error_json;
        }

        # General REST API Endpoints
        location /api/ {
            limit_req zone=api_ip_limit burst=3000 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 6;
            proxy_next_upstream_timeout 30s;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_intercept_errors on;
            error_page 500 502 503 504 = @api_error_json;
        }

        # Frontend Production Static Bundles
        location /static/ {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Media & Font Assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # Frontend Application HTML & SPA Routing
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-cache, no-store, must-revalidate";

            proxy_intercept_errors on;
            error_page 500 502 503 504 /error_pages/50x.html;
        }
    }
}

