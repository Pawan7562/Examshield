# High-Performance Nginx Load Balancer for ExamShield (50k - 100k Concurrent Users)
user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 20480;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;

    # Fast I/O & Keep-Alive
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer & Payload tuning
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting Zones (High-concurrency & Campus NAT IP Friendly)
    limit_req_zone $binary_remote_addr zone=api_ip_limit:30m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=auth_ip_limit:15m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:30m;

    # Docker internal DNS resolver for dynamic service and replica discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend Cluster Upstream (Load Balancer)
    upstream backend_cluster {
        # Least connections distributes requests to the least busy server
        least_conn;
        
        server backend:5000 max_fails=3 fail_timeout=10s;
        server backend_2:5000 max_fails=3 fail_timeout=10s;
        
        keepalive 64;
    }

    # Socket.IO Cluster Upstream (Sticky Session required for long-polling / WebSocket handshake)
    upstream socketio_cluster {
        ip_hash; # Preserves sticky connections across multi-instance nodes
        server backend:5000 max_fails=3 fail_timeout=10s;
        server backend_2:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # 1. HTTP Server - Redirect to HTTPS
    server {
        listen 80;
        server_name exam.nexifyforge.in www.exam.nexifyforge.in localhost;

        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","load_balancer":"nginx"}\n';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server - Secure SSL
    server {
        listen 443 ssl;
        server_name exam.nexifyforge.in www.exam.nexifyforge.in localhost;

        ssl_certificate /etc/letsencrypt/live/exam.nexifyforge.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/exam.nexifyforge.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection Limit (Permits 3,000 concurrent conns per IP to accommodate batch campus testing)
        limit_conn conn_limit 3000;

        # Health Check Endpoint
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","load_balancer":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # WebSocket / Socket.IO Live Monitoring Endpoint
        location /socket.io/ {
            proxy_pass http://socketio_cluster;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for continuous monitoring during exams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # API Authentication Endpoints (Accommodates 2,000+ candidates logging in concurrently)
        location /api/auth/ {
            limit_req zone=auth_ip_limit burst=150 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General REST API Endpoints (Heartbeats, autosaves, telemetry)
        location /api/ {
            limit_req zone=api_ip_limit burst=300 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend Production Static Bundles (Cache-Control: immutable for hashed chunks)
        location /static/ {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Media & Font Assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # Frontend Application HTML & SPA Routing (No-cache for index.html so updates are immediate)
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
