# ==============================================================================
# Hostinger VPS Production & 2,000-Student High-Concurrency Architecture
# ==============================================================================
services:
  # 1. Reverse Proxy & SSL Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: examshield_load_balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend_1
      - backend_2
      - frontend
    networks:
      - examshield_network

  # 2. Local In-Memory Redis Cache & Pub/Sub (Socket.IO clustering)
  redis:
    image: redis:7-alpine
    container_name: examshield_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2048mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - examshield_network

  # 3. High-Performance PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: examshield_postgres
    restart: always
    environment:
      POSTGRES_DB: examshield_prod
      POSTGRES_USER: examshield_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongSecurePass2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_vps_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=1024MB
      -c effective_cache_size=3072MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    networks:
      - examshield_network

  # 4. PgBouncer Connection Pooler (Multiplexes 2,000+ client requests into 50 DB connections)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: examshield_pgbouncer
    restart: always
    environment:
      DB_USER: examshield_admin
      DB_PASSWORD: ${DB_PASSWORD:-StrongSecurePass2026!}
      DB_HOST: postgres
      DB_PORT: 5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 15
      SERVER_IDLE_TIMEOUT: 60
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    networks:
      - examshield_network

  # 5a. Primary Backend Cluster Node
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: cluster_node_1
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://examshield_admin:${DB_PASSWORD:-StrongSecurePass2026!}@pgbouncer:6432/examshield_prod?sslmode=disable
      PG_POOL_MAX: 100
      PG_CONNECTION_TIMEOUT_MS: 10000
    depends_on:
      - redis
      - pgbouncer
    networks:
      - examshield_network

  # 5b. Replica Backend Cluster Node
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: cluster_node_2
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://examshield_admin:${DB_PASSWORD:-StrongSecurePass2026!}@pgbouncer:6432/examshield_prod?sslmode=disable
      PG_POOL_MAX: 100
      PG_CONNECTION_TIMEOUT_MS: 10000
    depends_on:
      - redis
      - pgbouncer
    networks:
      - examshield_network

  # 6. Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - examshield_network

networks:
  examshield_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
